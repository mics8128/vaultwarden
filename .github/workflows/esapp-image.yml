# esapp fork: builds the amd64 image and pushes it to ghcr.io/<owner>/vaultwarden.
# Tag: <upstream version>-esapp.<commits on top of that version>, e.g. 1.37.5-esapp.10, plus esapp-key-connector.
name: esapp image

on:
  push:
    branches: [esapp/key-connector]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: esapp-image-${{ inputs.ref || github.ref }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        id: version
        run: |
          base=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
          rev=$(git rev-list --count "${base}..HEAD")
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "tag=${base}-esapp.${rev}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vaultwarden" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.debian
          platforms: linux/amd64
          push: true
          build-args: |
            VW_VERSION=${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ inputs.ref == '' && format('{0}:esapp-key-connector', steps.version.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
